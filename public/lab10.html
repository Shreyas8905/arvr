<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple A-Frame Scene</title>
    <script src="aframe.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      button {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        font-size: 16px;
        background-color: #4cc3d9;
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        z-index: 10;
      }
      button:hover {
        background-color: #3a9ca1;
      }
    </style>
  </head>
  <body style="background-image: url(&quot;images.jpg&quot;)">
    <a-scene>
      <a-assets>
        <a-asset-item id="value" src="space.glb"></a-asset-item>
      </a-assets>
      <a-entity position="0 1.6 0">
        <a-camera></a-camera>
      </a-entity>
      <a-entity
        id="model"
        gltf-model="#value"
        position="0 0 -30"
        rotation="0 10 0"
        scale="1 1 1"
      ></a-entity>
    </a-scene>
    <button onclick="rotateModel()">Rotate Model</button>
    <script>
      function rotateModel() {
        const model = document.querySelector("#model");
        let currentRotation = model.getAttribute("rotation");
        currentRotation.y += 10;
        model.setAttribute("rotation", currentRotation);
      }
    </script>
  </body>
</html>
