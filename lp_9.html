<html>
  <head>
    <script src="aframe.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      button {
        position: absolute;
        top: 20px;
      }
    </style>
  </head>
  <body>
    <a-scene background="color: black">
      <a-assets>
        <a-asset-item id="value" src="space.glb"></a-asset-item>
      </a-assets>
      <a-entity position="0 1.6 4">
        <a-camera></a-camera>
      </a-entity>
      <a-entity
        id="model"
        gltf-model="#value"
        position="0 0 -30"
        rotation="0 10 0"
        scale="1 1 1"
      ></a-entity>
    </a-scene>
    <button onClick="rotateModel()">Rotate</button>
    <script>
      function rotateModel() {
        const model = document.querySelector("#model");
        let currentRotation = model.getAttribute("rotation");
        currentRotation.y += 10;
        model.setAttribute("rotation", currentRotation);
      }
    </script>
  </body>
</html>
