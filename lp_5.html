<html>
  <head>
    <script src="aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity position="0 0.5 5">
        <a-camera></a-camera>
      </a-entity>
      <a-light type="ambient" intensity="5.0"></a-light>
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        color="black"
        height="10"
        width="10"
      ></a-plane>
      <a-box
        position="0 1 0"
        rotation="0 0 0"
        color="red"
        animation="property: rotation; to: 90 180 360; loop: true; dur:5000"
      ></a-box>
    </a-scene>
  </body>
</html>
