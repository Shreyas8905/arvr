<html>
  <head>
    <script src="aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: black">
      <a-entity position="0 1.6 4">
        <a-camera
          wasd-controls
          look-controls
          cursor="rayOrigin: mouse"
          raycaster="objects: .interactive"
        ></a-camera>
      </a-entity>
      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light
        type="directional"
        intensity="1"
        castShadow="true"
        position="-1 4 2"
      ></a-light>
      <a-box
        class="interactive"
        position="-2 0.5 -3"
        color="red"
        glitch-scale
      ></a-box>
      <a-cylinder
        class="interactive"
        position="0 0.75 -3"
        radius="0.5"
        height="1.5"
        color="green"
        stress-test
        wasd-controls
      ></a-cylinder>
      <a-plane
        height="10"
        width="10"
        color="grey"
        rotation="-90 0 0"
        position="0 0 0"
      ></a-plane>
    </a-scene>
    <script>
      AFRAME.registerComponent("glitch-scale", {
        init: function () {
          const el = this.el;
          isStretched = false;
          el.addEventListener("click", function () {
            if (!isStretched) {
              el.setAttribute("scale", "1 2 1");
            } else {
              el.setAttribute("scale", "1 1 1");
            }
            isStretched = !isStretched;
          });
        },
      });
      AFRAME.registerComponent("stress-test", {
        init: function () {
          const el = this.el;
          el.addEventListener("mouseenter", function () {
            el.setAttribute("wireframe", true);
          });
          el.addEventListener("mouseleave", function () {
            el.setAttribute("wireframe", "false");
          });
        },
      });
    </script>
  </body>
</html>
